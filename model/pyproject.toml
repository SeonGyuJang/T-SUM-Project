[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realstar_model"
version = "0.1.0"
description = "리얼별점: 한국어 쇼핑 리뷰 AI 작성 탐지 모델 (MODEL_DEV.md)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.optional-dependencies]
# AI 리뷰 생성 (Claude API)
gen = ["anthropic>=2.0"]
# 한국어 인코더 분류기 학습·추론 (GPU 권장)
encoder = ["torch>=2.2", "transformers>=4.44", "accelerate>=0.30"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
realstar-model = "realstar_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
realstar_model = ["preprocess/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
