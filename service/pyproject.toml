[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realstar-service"
version = "0.1.0"
description = "리얼별점 서비스: 수집·이미지 판독·집계·API·워커 (AI 탐지 모델은 model/의 realstar_model 패키지)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "numpy>=1.26",
  "pillow>=10.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "httpx>=0.27",
  "selenium>=4.21",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
worker = ["celery>=5.4", "redis>=5.0"]
postgres = ["psycopg[binary]>=3.1"]
ocr = ["paddleocr>=2.8", "paddlepaddle>=2.6"]
vlm = ["transformers>=4.49", "torch>=2.3", "accelerate>=0.30"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "fakeredis>=2.23"]

[project.scripts]
realstar = "realstar.cli:main"

[tool.setuptools.packages.find]
where = ["packages/core", "apps/api", "apps/worker", "apps/detector_server"]

[tool.setuptools.package-data]
"realstar.collectors.coupang" = ["selectors.yaml"]
"realstar.vision" = ["ui_phrases.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: 실제 쿠팡 사이트에 접속하는 스모크 테스트 (CI에서 실행 금지, 수동 실행)",
  "contract: realstar_model 패키지가 설치된 경우에만 실행되는 계약 테스트",
  "browser: 로컬 Chrome + chromedriver가 필요한 테스트",
]

[tool.coverage.run]
source = ["realstar"]

[tool.ruff]
line-length = 110
extend-exclude = ["migrations/versions"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.ruff.lint.isort]
known-first-party = ["realstar", "realstar_api", "realstar_worker", "realstar_detector_server"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]
