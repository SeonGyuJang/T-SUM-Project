[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realstar_model"
version = "0.2.0"
description = "리얼별점: 한국어 쇼핑 리뷰 AI 작성 탐지 — 서비스용 추론 런타임 (학습은 kor-ai-detector)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
# 한국어 인코더 분류기 추론
encoder = ["torch>=2.2", "transformers>=4.44"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
realstar_model = ["preprocess/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
