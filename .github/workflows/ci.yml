# CI: 실제 쿠팡에는 접속하지 않는다(README 10). FixtureProvider + 더미 판별기 + HTML 스냅샷으로 검증.
name: CI
on:
  push:
  pull_request:

jobs:
  service-python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: service } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: realstar, POSTGRES_PASSWORD: realstar, POSTGRES_DB: realstar }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U realstar" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: service/pyproject.toml }
      - run: pip install -e ".[api,worker,postgres,dev]"
      - run: ruff check .
      - run: mypy packages apps
      - run: pytest --cov=realstar --cov-fail-under=80 -m "not live"
      - name: Alembic 마이그레이션 (PostgreSQL 16)
        env: { DATABASE_URL: "postgresql+psycopg://realstar:realstar@localhost:5432/realstar" }
        run: alembic upgrade head && alembic check

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: service/apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: service/apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: "true" }
