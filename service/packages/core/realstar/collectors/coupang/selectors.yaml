# 쿠팡 화면 셀렉터 (README 0-4: 코드에 하드코딩하지 않는다)
#
# ⚠️ 상태: DRAFT — 실제 화면으로 검증되지 않았다.
#   Phase 0 spike(docs/phase0-spike-guide.md)에서 실제 상품 3개를 열어 DOM을 확인한 뒤
#   이 파일을 고치고, 같은 화면의 HTML 스냅샷을 tests/fixtures/html/에 저장한다.
#   각 항목은 앞에서부터 차례로 시도하는 후보 목록이다(쿠팡 화면 구조는 수시로 바뀐다).
#   셀렉터를 바꾸면 version을 올린다. 결과 JSON의 sampling.selectors_version에 기록된다.
version: "2026-11-13-draft"

urls:
  base: "https://www.coupang.com"
  product: "https://www.coupang.com/vp/products/{product_id}"
  search: "https://www.coupang.com/np/search?q={query}&channel=user"
  # 리뷰 목록이 별도 HTML 조각으로 로드되는 구조일 때만 사용(README 5.2 허용 방식).
  review_fragment: "https://www.coupang.com/vp/product/reviews?productId={product_id}&page={page}&size={size}&sortBy={sort_by}&ratings={star}&q=&viRoleCode=3&ratingSummary=true"
  review_fragment_page_size: 10
  # 방문해도 되는 공개 영역(정규식). 여기에 없는 주소는 열지 않는다.
  allowed_patterns:
    - '^https://(www\.)?coupang\.com/vp/products/\d+'
    - '^https://(www\.)?coupang\.com/vp/product/reviews\?'
    - '^https://(www\.)?coupang\.com/np/search\?'
    - '^https://m\.coupang\.com/vm/products/\d+'
    - '^https://link\.coupang\.com/'
    - '^https://coupa\.ng/'
  # 최종 주소가 이 패턴이면 금지 영역(로그인·장바구니·주문·마이쿠팡)으로 보고 즉시 중단한다.
  forbidden_patterns:
    - 'login\.coupang\.com'
    - '/login'
    - 'cart\.coupang\.com'
    - '/cart'
    - 'checkout'
    - '/order'
    - 'mc\.coupang\.com'
    - '/my/'

review_mode: interactive # interactive(화면 조작) | fragment(리뷰 조각 URL)

block:
  title_patterns:
    - 'Access Denied'
    - '403 Forbidden'
    - '접근이 거부'
    - '보안 확인'
  body_patterns:
    - 'Access Denied'
    - "You don't have permission to access"
    - 'Reference\s*#\s*[0-9a-f.]+'
    - '자동입력 방지'
    - '로봇이 아닙니다'
    - '비정상적인 접근'
    - '사용권한이 없습니다'          # 2026-11-13 실측: 자동화 브라우저에 반환된 쿠팡 접근 거부 페이지
    - '사용권한이 제한된 페이지'
    - 'Please verify you are a human'
  element_selectors:
    - 'iframe[src*="captcha"]'
    - 'iframe[src*="challenge"]'
    - '#captcha'
    - '.g-recaptcha'
    - '#px-captcha'
    - 'form#challenge-form'
  # 리뷰 영역이 연속으로 비어 있을 때 차단으로 판단하는 횟수는 SCRAPER_EMPTY_STREAK_LIMIT(.env)

search:
  ready: ['#product-list', '#productList', 'ul.search-product-list']
  item: ['#product-list > li', 'ul#productList > li.search-product', 'li.search-product']
  link: ['a[href*="/vp/products/"]']
  name: ['[class*="productName"]', 'div.name', '.name']
  price: ['[class*="priceValue"]', 'strong.price-value', '.price-value']
  image: ['figure img', 'img.search-product-wrap-img', 'img']
  ad_badge: ['[class*="AdMark"]', '.ad-badge', '.ad-badge-text', '.search-product__ad-badge']
  ad_item_class_patterns: ['search-product__ad', 'AdMark']
  rating: ['[class*="ratingStar"] [class*="rating"]', 'em.rating', '.rating']
  review_count: ['[class*="ratingCount"]', 'span.rating-total-count', '.rating-total-count']

product:
  ready: ['.prod-buy-header__title', 'h1.product-title', '.prod-buy-header']
  name: ['.prod-buy-header__title', 'h1.product-title', 'h2.prod-buy-header__title']
  image: ['.prod-image__detail', 'img.prod-image__detail', '.prod-image img']
  category: ['#breadcrumb li:last-child a', '.breadcrumb li:last-child']
  # 평균 별점: 텍스트 숫자 또는 style="width: 84%" (100% = 5점)
  avg_text: ['.rating-star-num', '.sdp-review__average__total-star__info-orange', '.prod-rating__number']
  avg_width: ['.rating-star-num', '.prod-buy-header__rating .rating-star-num']
  total_reviews: ['.count', '.prod-buy-header__review-count', '.sdp-review__average__total-star__info-count']
  total_reviews_pattern: '([\d,]+)\s*(개\s*상품평|건|개)'
  # 별점 분포: 항목마다 별점과 개수(또는 %)를 읽는다
  star_rows: ['.sdp-review__article__order__star__list__item', '.js_reviewArticleOrderStarAllContainer li', '.rating-summary li']
  star_row_star_attr: 'data-rating'
  star_row_star_text: ['.sdp-review__article__order__star__list__item__content', '.label']
  star_row_count: ['.sdp-review__article__order__star__list__item__count', '.count']
  star_row_percent: ['.sdp-review__article__order__star__list__item__percentage', '.percent', '.graph']

reviews:
  section: ['#sdpReview', '.sdp-review', '#btfTab .product-review']
  # 목록 컨테이너가 아니라 실제 리뷰(또는 '리뷰 없음' 표시)가 나타나야 준비된 것으로 본다
  list_ready: ['article.sdp-review__article__list', '.sdp-review__article__no-review']
  no_review: ['.sdp-review__article__no-review']
  item: ['article.sdp-review__article__list']
  review_id_attrs: ['data-review-id', 'data-reviewid']
  review_id_child: ['[data-review-id]', '.sdp-review__article__list__help']
  star: ['.sdp-review__article__list__info__product-info__star-orange', '[data-rating]']
  star_attr: 'data-rating'
  title: ['.sdp-review__article__list__headline']
  content: ['.sdp-review__article__list__review__content', '.sdp-review__article__list__review > div']
  date: ['.sdp-review__article__list__info__product-info__reg-date']
  date_pattern: '(\d{4})[.\-/]\s*(\d{1,2})[.\-/]\s*(\d{1,2})'
  photo: ['.sdp-review__article__list__attachment__list img', '.sdp-review__article__list__attachment img']
  helpful: ['.sdp-review__article__list__help__count strong', '.sdp-review__article__list__help']
  helpful_attr: 'data-count'
  option: ['.sdp-review__article__list__info__product-info__name']
  author: ['.sdp-review__article__list__info__user__name']
  # 화면 조작(interactive 모드)
  sort_latest: ['.sdp-review__article__order__sort__newest-btn', 'button[data-order="DATE_DESC"]']
  sort_latest_active_class: 'sdp-review__article__order__sort__newest-btn--active'
  star_filter_open: ['.sdp-review__article__order__star__all', '.js_reviewArticleOrderStarAllContainer']
  star_filter_option: '.sdp-review__article__order__star__list__item[data-rating="{star}"]'
  page_button: '.sdp-review__article__page__num[data-page="{page}"]'
  next_page_group: ['.sdp-review__article__page__next--active', '.sdp-review__article__page__next:not(.sdp-review__article__page__next--disable)']
  # 본문이 서버에서 잘려 오는 경우에만 '더보기'를 누른다. DOM에 전문이 있으면 비워 둔다.
  more_button: []
  sort_by_param: { latest: 'DATE_DESC', best: 'ORDER_SCORE_ASC' }
  # 필수 필드: 누락률이 SCRAPER_PARSER_FAIL_THRESHOLD를 넘으면 ParserBrokenError
  required_fields: ['star', 'content', 'date']
